
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci

  build:
    commands:
      - npm run build

  post_build:
    commands:
      - aws s3 sync out/ s3://cloudtrack-nextjs-aws-2026-v1/ --delete

artifacts:
  files:
    - '**/*'
  base-directory: out
